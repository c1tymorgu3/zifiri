<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Deletion in three levels, two of them claimed</title>
  <desc id="desc">Level one deletes the row by owner hash and leaves no tombstone. Level two zeroes the freed pages, truncates the write-ahead log and rebuilds the file, so the body is in neither the database nor the log. Level three, the block device, is not claimed; only full-disk encryption reduces it.</desc>
  <rect width="900" height="300" fill="#0b0c0e"/>
  <text x="28" y="34" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f2f3f5">Deletion, level by level</text>
  <text x="28" y="53" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b909a">What "yok ol" actually does, and where the claim stops.</text>

  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
    <rect x="28" y="76" width="118" height="54" rx="6" fill="#12141a" stroke="#262a33"/>
    <text x="40" y="99" font-size="10" font-weight="600" fill="#3fb950" letter-spacing="0.6">LEVEL 1</text>
    <text x="40" y="116" font-size="10" fill="#8b909a">the row</text>

    <rect x="158" y="76" width="165" height="54" rx="6" fill="#12141a" stroke="#262a33"/>
    <text x="170" y="99" font-size="9.5" fill="#f2f3f5">DELETE WHERE</text>
    <text x="170" y="114" font-size="9.5" fill="#8b909a">owner_hash = ?</text>

    <rect x="341" y="76" width="165" height="54" rx="6" fill="#12141a" stroke="#262a33"/>
    <text x="353" y="99" font-size="9.5" fill="#f2f3f5">no tombstone</text>
    <text x="353" y="114" font-size="9.5" fill="#8b909a">no "deleted" row</text>

    <rect x="524" y="76" width="165" height="54" rx="6" fill="#12141a" stroke="#262a33"/>
    <text x="536" y="99" font-size="9.5" fill="#f2f3f5">file size unchanged</text>
    <text x="536" y="114" font-size="9.5" fill="#8b909a">pages are still there</text>

    <rect x="707" y="76" width="165" height="54" rx="6" fill="#12141a" stroke="#262a33"/>
    <text x="719" y="99" font-size="9.5" fill="#f2f3f5">404 on read</text>
    <text x="719" y="114" font-size="9.5" fill="#8b909a">one size, no path echo</text>

    <rect x="28" y="142" width="118" height="62" rx="6" fill="#12141a" stroke="#e8a33d" stroke-opacity="0.55"/>
    <text x="40" y="165" font-size="10" font-weight="600" fill="#e8a33d" letter-spacing="0.6">LEVEL 2</text>
    <text x="40" y="182" font-size="10" fill="#8b909a">the disk</text>

    <rect x="158" y="142" width="130" height="62" rx="6" fill="#12141a" stroke="#262a33"/>
    <text x="169" y="165" font-size="9.5" fill="#f2f3f5">secure_delete=ON</text>
    <text x="169" y="181" font-size="9.5" fill="#8b909a">freed pages zeroed</text>
    <text x="169" y="196" font-size="9.5" fill="#8b909a">per connection</text>

    <rect x="304" y="142" width="130" height="62" rx="6" fill="#12141a" stroke="#262a33"/>
    <text x="315" y="165" font-size="9.5" fill="#f2f3f5">checkpoint</text>
    <text x="315" y="181" font-size="9.5" fill="#8b909a">TRUNCATE the -wal</text>
    <text x="315" y="196" font-size="9.5" fill="#8b909a">busy is reported</text>

    <rect x="450" y="142" width="130" height="62" rx="6" fill="#12141a" stroke="#262a33"/>
    <text x="461" y="165" font-size="9.5" fill="#f2f3f5">VACUUM</text>
    <text x="461" y="181" font-size="9.5" fill="#8b909a">rebuild the file</text>
    <text x="461" y="196" font-size="9.5" fill="#8b909a">with backoff</text>

    <rect x="596" y="142" width="130" height="62" rx="6" fill="#12141a" stroke="#262a33"/>
    <text x="607" y="165" font-size="9.5" fill="#f2f3f5">checkpoint again</text>
    <text x="607" y="181" font-size="9.5" fill="#8b909a">the rebuild writes</text>
    <text x="607" y="196" font-size="9.5" fill="#8b909a">to the log too</text>

    <rect x="742" y="142" width="130" height="62" rx="6" fill="#12141a" stroke="#3fb950" stroke-opacity="0.45"/>
    <text x="753" y="165" font-size="9.5" fill="#3fb950">body absent from</text>
    <text x="753" y="181" font-size="9.5" fill="#8b909a">.db and .db-wal</text>
    <text x="753" y="196" font-size="9.5" fill="#8b909a">measured by grep</text>

    <rect x="28" y="216" width="118" height="54" rx="6" fill="#12141a" stroke="#e0575b" stroke-opacity="0.45"/>
    <text x="40" y="239" font-size="10" font-weight="600" fill="#e0575b" letter-spacing="0.6">LEVEL 3</text>
    <text x="40" y="256" font-size="10" fill="#8b909a">the device</text>

    <rect x="158" y="216" width="714" height="54" rx="6" fill="#12141a" stroke="#262a33"/>
    <text x="170" y="239" font-size="9.5" fill="#f2f3f5">not claimed: SSD wear levelling, the filesystem journal, snapshots on the hypervisor.</text>
    <text x="170" y="256" font-size="9.5" fill="#8b909a">mitigation only — full-disk encryption (LUKS). No block-level guarantee is made.</text>
  </g>

  <g stroke="#8b909a" stroke-width="1.2" fill="none">
    <path d="M313 103 H339" marker-end="url(#b)"/>
    <path d="M496 103 H522" marker-end="url(#b)"/>
    <path d="M679 103 H705" marker-end="url(#b)"/>
    <path d="M278 173 H302" marker-end="url(#b)"/>
    <path d="M424 173 H448" marker-end="url(#b)"/>
    <path d="M570 173 H594" marker-end="url(#b)"/>
    <path d="M716 173 H740" marker-end="url(#b)"/>
  </g>
  <defs>
    <marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8b909a"/>
    </marker>
  </defs>
</svg>
