<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">The write path: pad, prove, queue, turn, publish</title>
  <desc id="desc">A message is padded to a fixed bucket and proved with a work token in the browser, dropped into a ten-minute in-memory bucket that is completed to 120 with decoys, shuffled and published in one burst, and only then becomes a row or a buffered line.</desc>
  <rect width="900" height="300" fill="#0b0c0e"/>
  <text x="28" y="34" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f2f3f5">The write path</text>
  <text x="28" y="53" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b909a">Five steps. The clock is the only thing that decides when a message leaves.</text>

  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
    <rect x="28" y="86" width="148" height="112" rx="6" fill="#12141a" stroke="#262a33"/>
    <text x="42" y="110" font-size="11" font-weight="600" fill="#e8a33d" letter-spacing="0.6">1 CLIENT</text>
    <text x="42" y="132" font-size="10" fill="#f2f3f5">pad to 4 KB</text>
    <text x="42" y="150" font-size="10" fill="#8b909a">one size per bucket</text>
    <text x="42" y="170" font-size="10" fill="#f2f3f5">solve PoW</text>
    <text x="42" y="188" font-size="10" fill="#8b909a">bound to the body</text>

    <rect x="202" y="86" width="148" height="112" rx="6" fill="#12141a" stroke="#262a33"/>
    <text x="216" y="110" font-size="11" font-weight="600" fill="#e8a33d" letter-spacing="0.6">2 ENVELOPE</text>
    <text x="216" y="132" font-size="10" fill="#f2f3f5">AEAD sealed</text>
    <text x="216" y="150" font-size="10" fill="#8b909a">key never sent</text>
    <text x="216" y="170" font-size="10" fill="#f2f3f5">fixed header</text>
    <text x="216" y="188" font-size="10" fill="#8b909a">length says nothing</text>

    <rect x="376" y="86" width="148" height="112" rx="6" fill="#12141a" stroke="#e8a33d" stroke-opacity="0.55"/>
    <text x="390" y="110" font-size="11" font-weight="600" fill="#e8a33d" letter-spacing="0.6">3 BUCKET · RAM</text>
    <text x="390" y="132" font-size="10" fill="#f2f3f5">10-minute window</text>
    <text x="390" y="150" font-size="10" fill="#8b909a">aligned to the clock</text>
    <text x="390" y="170" font-size="10" fill="#f2f3f5">target 120</text>
    <text x="390" y="188" font-size="10" fill="#8b909a">decoys fill the rest</text>

    <rect x="550" y="86" width="148" height="112" rx="6" fill="#12141a" stroke="#262a33"/>
    <text x="564" y="110" font-size="11" font-weight="600" fill="#e8a33d" letter-spacing="0.6">4 DRAIN</text>
    <text x="564" y="132" font-size="10" fill="#f2f3f5">shuffled</text>
    <text x="564" y="150" font-size="10" fill="#8b909a">not arrival order</text>
    <text x="564" y="170" font-size="10" fill="#f2f3f5">one burst</text>
    <text x="564" y="188" font-size="10" fill="#8b909a">same second for all</text>

    <rect x="724" y="86" width="148" height="112" rx="6" fill="#12141a" stroke="#262a33"/>
    <text x="738" y="110" font-size="11" font-weight="600" fill="#e8a33d" letter-spacing="0.6">5 SURFACE</text>
    <text x="738" y="132" font-size="10" fill="#f2f3f5">rooms · RAM</text>
    <text x="738" y="150" font-size="10" fill="#8b909a">15 min, then gone</text>
    <text x="738" y="170" font-size="10" fill="#f2f3f5">listings · row</text>
    <text x="738" y="188" font-size="10" fill="#8b909a">a day, never a second</text>
  </g>

  <g stroke="#8b909a" stroke-width="1.2" fill="none">
    <path d="M178 142 H200" marker-end="url(#a)"/>
    <path d="M352 142 H374" marker-end="url(#a)"/>
    <path d="M526 142 H548" marker-end="url(#a)"/>
    <path d="M700 142 H722" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8b909a"/>
    </marker>
  </defs>

  <line x1="28" y1="222" x2="872" y2="222" stroke="#262a33"/>
  <text x="28" y="244" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, monospace" font-size="10" fill="#8b909a">steps 1–4 touch no disk: the bucket is one ETS table and dies with the process.</text>
  <text x="28" y="262" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, monospace" font-size="10" fill="#8b909a">an observer sees n frames leave together and guesses the real one with p = 1/n.</text>
</svg>
