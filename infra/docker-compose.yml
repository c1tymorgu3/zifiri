# zifiri — deployment. plan §5.1, §10.1, §11.3, §11.4, §12
#
# Three services: app (Phoenix, unix socket), nginx (clearnet + onion entry),
# tor (onion service). None of them keeps logs: `logging.driver: none`.
#
# Shared assumptions:
#   - root filesystem is READ-ONLY; writes only through tmpfs (/tmp, /run) and
#     the single data volume (/var/lib/zifiri).
#   - UID 10001 is shared by app and nginx (socket permission), tor uses its own
#     image's user.
#   - port publish only on nginx. app has no external port.

name: zifiri

services:

  # -------------------------------------------------------------------------
  # Phoenix. Connects to nginx only via /run/zifiri/app.sock (§5.1).
  # -------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        # Pinned to a digest in CI (§10.3).
        ELIXIR_IMAGE: ${ELIXIR_IMAGE:-elixir:1.18-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.21}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        # `git log -1 --format=%ct` → two independent builds must produce the same hash.
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    image: zifiri-app:local
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    init: true
    stop_grace_period: 30s

    environment:
      # NO secrets. The pepper is read from a file, never written to an environment
      # variable (env is visible in `docker inspect` and /proc/<pid>/environ).
      ZIFIRI_SOCKET: /run/zifiri/app.sock
      ZIFIRI_PEPPER: /run/zifiri/pepper
      ZIFIRI_DB_PATH: /var/lib/zifiri/zifiri.db
      ZIFIRI_ERR_LOG: /var/lib/zifiri/err.log
      ZIFIRI_ONION: "1"
      RELEASE_DISTRIBUTION: none
      ERL_CRASH_DUMP: /dev/null
      ERL_CRASH_DUMP_SECONDS: "0"
      HOME: /tmp
      TMPDIR: /tmp
      LANG: C.UTF-8
      TZ: UTC

    volumes:
      # The SINGLE data volume (§11.4). Contains: zifiri.db, -wal, -shm, err.log.
      - zifiri-data:/var/lib/zifiri
      # Socket directory. Shared with nginx; it is not data, it can be
      # recreated (app recreates the socket on startup).
      - zifiri-run:/run/zifiri
      # The pepper lives only on tmpfs (§4.3, §11.4): generated on the host under
      # /run and mounted here read-only. If the file is missing compose fails
      # (`:?`), it does not silently open with an empty directory.
      - ${ZIFIRI_PEPPER_SRC:?pepper file required — see deploy.md}:/run/zifiri/pepper:ro

    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=8m,mode=0755,uid=10001,gid=10001

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Core dumps disabled (§5.1). Without this line the host's `ulimit -c`
    # setting is inherited by the container and a disk dump could be written when BEAM crashes.
    ulimits:
      core: 0
      nofile:
        soft: 4096
        hard: 4096

    # The socket's existence is the liveness proxy; the real readiness check is
    # done externally (deploy.md: onion + clearnet end-to-end).
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/zifiri/app.sock"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

    logging:
      driver: "none"

    networks:
      - backend

  # -------------------------------------------------------------------------
  # nginx. 80/443 clearnet, 127.0.0.1:8081 onion (same netns as tor).
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    # The official entrypoint scripts write to /etc/nginx/conf.d; on a read-only
    # root we skip them entirely.
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]

    depends_on:
      app:
        # Ownership of the zifiri-run volume comes from the app image (10001);
        # if nginx starts before it the volume is created root-owned and it cannot
        # connect to the socket.
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # NOT a template: a copy with $HOST/$ONION_HOST filled in during deploy.
      - ./nginx.conf.rendered:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./acme:/var/www/acme:ro
      # Socket: cannot be mounted read-only — connect() to a unix socket requires write permission.
      - zifiri-run:/run/zifiri

    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=8m,mode=0755,uid=10001,gid=10001

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ulimits:
      core: 0

    # No curl/wget inside the container; TCP connect test with busybox nc.
    healthcheck:
      test: ["CMD-SHELL", "nc -w 2 127.0.0.1 80 < /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: "none"

    networks:
      - edge
      - backend

  # -------------------------------------------------------------------------
  # tor. SHARES nginx's network namespace: 127.0.0.1 really is loopback,
  # so onion traffic and clearnet traffic appear from the same address and
  # the IP-based limit (§4.4) becomes meaningless — by design.
  # -------------------------------------------------------------------------
  tor:
    image: dockurr/tor:latest
    restart: unless-stopped
    read_only: true
    network_mode: "service:nginx"
    depends_on:
      nginx:
        condition: service_started

    volumes:
      # Full torrc: SocksPort, HiddenServiceDir, HiddenServicePort → 127.0.0.1:8081.
      # Mounted as a single file so the image's other files under /etc/tor remain.
      - ./tor/config/torrc:/etc/tor/torrc:ro
      # Onion v3 key. It is PERSISTENT and the address changes if it is not backed up (§11.5).
      # It is not user data; outside the single-volume rule.
      - ./tor/data:/var/lib/tor

    tmpfs:
      - /tmp:size=16m,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    ulimits:
      core: 0

    # The hostname file appears once the hidden service is published.
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/tor/hidden_service/hostname"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

    logging:
      driver: "none"

volumes:
  zifiri-data:
    # The single data volume. NO backup (§11.5): disk loss = content loss.
  zifiri-run:
    # Unix socket only. It does not need to be persistent.

networks:
  # app cannot reach the outside: network without internet access.
  backend:
    internal: true
  edge: {}
