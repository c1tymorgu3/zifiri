# zifiri — dağıtım. plan §5.1, §10.1, §11.3, §11.4, §12
#
# Üç servis: app (Phoenix, unix soket), nginx (clearnet + onion girişi),
# tor (onion servisi). Hiçbiri log tutmaz: `logging.driver: none`.
#
# Ortak kabuller:
#   - kök dosya sistemi READ-ONLY; yazma yalnız tmpfs (/tmp, /run) ve
#     tek veri volume'ü (/var/lib/zifiri) üzerinden.
#   - UID 10001 app ve nginx için ortak (soket izni), tor kendi imajının
#     kullanıcısıyla.
#   - port publish yalnız nginx'te. app'in dışarı portu yoktur.

name: zifiri

services:

  # -------------------------------------------------------------------------
  # Phoenix. nginx'e yalnız /run/zifiri/app.sock üzerinden bağlanır (§5.1).
  # -------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        # CI'da digest'e sabitlenir (§10.3).
        ELIXIR_IMAGE: ${ELIXIR_IMAGE:-elixir:1.18-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.21}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        # `git log -1 --format=%ct` → iki bağımsız build aynı hash'i üretmeli.
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    image: zifiri-app:local
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    init: true
    stop_grace_period: 30s

    environment:
      # Sır YOK. pepper dosyadan okunur, ortam değişkenine yazılmaz
      # (env, `docker inspect` ve /proc/<pid>/environ'da görünür).
      ZIFIRI_SOCKET: /run/zifiri/app.sock
      ZIFIRI_PEPPER: /run/zifiri/pepper
      ZIFIRI_DB_PATH: /var/lib/zifiri/zifiri.db
      ZIFIRI_ERR_LOG: /var/lib/zifiri/err.log
      ZIFIRI_ONION: "1"
      RELEASE_DISTRIBUTION: none
      ERL_CRASH_DUMP: /dev/null
      ERL_CRASH_DUMP_SECONDS: "0"
      HOME: /tmp
      TMPDIR: /tmp
      LANG: C.UTF-8
      TZ: UTC

    volumes:
      # TEK veri volume'ü (§11.4). İçinde: zifiri.db, -wal, -shm, err.log.
      - zifiri-data:/var/lib/zifiri
      # Soket dizini. nginx ile paylaşılır; veri değildir, yeniden
      # oluşturulabilir (app açılışta soketi yeniden yaratır).
      - zifiri-run:/run/zifiri
      # Pepper yalnız tmpfs'te durur (§4.3, §11.4): host'ta /run altında
      # üretilir, buraya read-only bağlanır. Dosya yoksa compose hata verir
      # (`:?`), sessizce boş bir dizinle açılmaz.
      - ${ZIFIRI_PEPPER_SRC:?pepper dosyası gerekli — bkz. deploy.md}:/run/zifiri/pepper:ro

    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=8m,mode=0755,uid=10001,gid=10001

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Çekirdek dökümü kapalı (§5.1). Bu satır olmadan host'un `ulimit -c`
    # ayarı konteynere miras kalır ve BEAM çökünce disk dökümü yazılabilir.
    ulimits:
      core: 0
      nofile:
        soft: 4096
        hard: 4096

    # Soketin varlığı canlılık vekilidir; gerçek hazır-olma kontrolü
    # dışarıdan yapılır (deploy.md: onion + clearnet uçtan uca).
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/zifiri/app.sock"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

    logging:
      driver: "none"

    networks:
      - backend

  # -------------------------------------------------------------------------
  # nginx. 80/443 clearnet, 127.0.0.1:8081 onion (tor ile aynı netns).
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    # Resmi entrypoint betikleri /etc/nginx/conf.d yazar; read-only kökte
    # bunları tamamen atlıyoruz.
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]

    depends_on:
      app:
        # zifiri-run volume'ünün sahipliği app imajından (10001) gelir;
        # nginx ondan önce başlarsa volume root sahipli doğar ve sokete
        # bağlanamaz.
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Şablon DEĞİL: deploy sırasında $HOST/$ONION_HOST doldurulmuş kopya.
      - ./nginx.conf.rendered:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./acme:/var/www/acme:ro
      # Soket: read-only bağlanamaz — unix sokete connect() yazma izni ister.
      - zifiri-run:/run/zifiri

    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=8m,mode=0755,uid=10001,gid=10001

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ulimits:
      core: 0

    # Konteyner içinde curl/wget yok; busybox nc ile TCP bağlantı testi.
    healthcheck:
      test: ["CMD-SHELL", "nc -w 2 127.0.0.1 80 < /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: "none"

    networks:
      - edge
      - backend

  # -------------------------------------------------------------------------
  # tor. nginx'in ağ ad alanını PAYLAŞIR: 127.0.0.1 gerçekten loopback olur,
  # yani onion trafiği de clearnet trafiği de aynı adresten görünür ve
  # IP bazlı limit (§4.4) anlamsız kalır — tasarım gereği.
  # -------------------------------------------------------------------------
  tor:
    image: dockurr/tor:latest
    restart: unless-stopped
    read_only: true
    network_mode: "service:nginx"
    depends_on:
      nginx:
        condition: service_started

    volumes:
      # Tam torrc: SocksPort, HiddenServiceDir, HiddenServicePort → 127.0.0.1:8081.
      # Dosya olarak bağlanır ki imajın /etc/tor altındaki diğer dosyaları kalsın.
      - ./tor/config/torrc:/etc/tor/torrc:ro
      # Onion v3 anahtarı. KALICIDIR ve yedeklenmezse adres değişir (§11.5).
      # Kullanıcı verisi değildir; tek volume kuralının dışında.
      - ./tor/data:/var/lib/tor

    tmpfs:
      - /tmp:size=16m,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    ulimits:
      core: 0

    # hostname dosyası, hidden service yayımlandığında oluşur.
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/tor/hidden_service/hostname"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

    logging:
      driver: "none"

volumes:
  zifiri-data:
    # Tek veri volume'ü. Yedek YOK (§11.5): disk kaybı = içerik kaybı.
  zifiri-run:
    # Yalnız unix soket. Kalıcı olması gerekmez.

networks:
  # app dışarı çıkamaz: internet erişimi olmayan ağ.
  backend:
    internal: true
  edge: {}
