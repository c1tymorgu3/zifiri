# zifiri — nginx (clearnet + onion), plan §5.1 / §10.1 / §11.3
#
# THIS FILE IS A TEMPLATE. Two things are replaced during deploy (deploy.md):
#   $HOST        → the real domain name
#   $ONION_HOST  → contents of /var/lib/tor/hidden_service/hostname (...onion)
# nginx does not expand environment variables; loading the template without
# substituting breaks `server_name` and the CSP.

worker_processes  auto;
pid               /run/nginx.pid;

# §5.1 — no error log. Even the `crit` threshold goes to /dev/null; the client
# address cannot end up in error entries because there are no entries. For
# debugging, temporarily set `error_log stderr warn;` and enable the container
# log driver — then revert.
error_log  /dev/null crit;

events {
    worker_connections  1024;
    multi_accept        off;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types_hash_max_size 2048;

    server_tokens off;

    # ---------------------------------------------------------------------
    # §5.1 — ACCESS LOG. "Not writing the directive" does not mean no log: the
    # compile-time default is logs/access.log. Hence an explicit `off`.
    # Once at the http level; server blocks inherit it.
    # Verify: `nginx -T | grep -nE '^\s*access_log'` → only `access_log off;`
    # (comment lines also contain `access_log`, hence the anchor is required)
    # ---------------------------------------------------------------------
    access_log  off;

    # §4.1 — largest bucket 16 KB + fixed envelope. 32k buffer, so the body is
    # never written to disk (temp file) under any condition.
    client_max_body_size        24k;
    client_body_buffer_size     32k;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 8k;
    client_body_in_file_only    off;

    # All temporary paths go to /tmp (tmpfs in the container). On a read_only
    # root fs /var/cache/nginx does not exist and must not.
    client_body_temp_path  /tmp/nginx/client_body;
    proxy_temp_path        /tmp/nginx/proxy;
    fastcgi_temp_path      /tmp/nginx/fastcgi;
    uwsgi_temp_path        /tmp/nginx/uwsgi;
    scgi_temp_path         /tmp/nginx/scgi;

    # §4.1 — bodies are padded to a fixed bucket. Compression changes the bucket
    # size based on content, i.e. makes the padding useless. Off.
    gzip off;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    reset_timedout_connection on;

    # WebSocket (Phoenix Channels). An empty value drops the header, so
    # upstream keepalive keeps working for normal requests.
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       '';
    }

    # §10.1 — only hashed assets are cached; API and HTML are no-store.
    # The single `add_header` place: writing add_header in a location resets the
    # security headers above, hence the map is used.
    map $uri $zifiri_cache_control {
        ~^/assets/   "public, max-age=31536000, immutable";
        default      "no-store";
    }

    # §5.1 — nginx → Phoenix unix socket. No TCP, so on the BEAM side no real
    # peer address is formed.
    upstream zifiri_app {
        server unix:/run/zifiri/app.sock;
        keepalive 16;
    }

    # =====================================================================
    # §5.1 — the only real way to uphold "IP never enters the BEAM".
    #
    # nginx passes client headers upstream BY DEFAULT; i.e. the X-Forwarded-For
    # the client itself sends reaches Phoenix as-is. Assigning an empty value
    # drops the header entirely (nginx does not send headers with empty
    # values).
    #
    # RULE: `proxy_set_header` is an array-type directive — it is NOT inherited,
    # it is COPIED. When a single line is written at a lower level, the ENTIRE
    # list from the upper level is dropped for that level. Therefore the list is
    # not here (http) but written in full in every server block that proxies:
    # clearnet :443 and onion 127.0.0.1:8081. It is deliberately copied so the
    # two blocks can be verified separately; when you add a line to one, add it
    # to the other too (`scripts/verify_onion.sh` counts both).
    #
    # Not a single proxy_set_header must be written in location blocks — if it
    # is, the whole list is dropped in that location and the IP starts leaking.
    #
    # `real_ip` / `set_real_ip_from` / `proxy_protocol` are NOT used: any
    # configuration that parses XFF is a risk of mistaking a client-invented
    # value for the real address; on a unix socket it is not needed anyway.
    # =====================================================================

    # Don't leak the upstream's own signature.
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # =====================================================================
    # :80 — ACME challenge only and redirect to HTTPS.
    # =====================================================================
    server {
        listen      80;
        server_name $HOST;

        access_log  off;

        # certbot webroot mode: runs on the host, mounts the directory here
        # read-only (deploy.md). The container needs no write permission.
        location ^~ /.well-known/acme-challenge/ {
            root         /var/www/acme;
            default_type text/plain;
            access_log   off;
            add_header   Cache-Control "no-store" always;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =====================================================================
    # :443 — clearnet
    # =====================================================================
    server {
        listen      443 ssl;
        http2       on;
        server_name $HOST;

        access_log  off;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;   # forward secrecy without tickets
        # No OCSP stapling: Let's Encrypt shut down its OCSP service.

        # --- §10.1 security headers ---------------------------------------
        # CSP, the string from plan §10.1 — verbatim. No inline script/style.
        # `require-trusted-types-for 'script'` is defense in depth
        # (browser support varies), still sent.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' wss://$HOST; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), usb=(), xr-spatial-tracking=(), interest-cohort=()" always;
        add_header Cache-Control $zifiri_cache_control always;

        # §11.3 — the onion address is advertised in the clearnet response. This
        # header exists ONLY here (clearnet); there is no counterpart in the onion block.
        add_header Onion-Location "http://$ONION_HOST$request_uri" always;

        # §5.1 — full list (see the RULE note at the http level). The array-type
        # directive is COPIED, not inherited: if the list is incomplete in this
        # block nginx uses this incomplete list, not the one above.
        proxy_set_header Host                 $host;
        proxy_set_header X-Forwarded-Proto    $scheme;
        proxy_set_header Upgrade              $http_upgrade;
        proxy_set_header Connection           $connection_upgrade;

        # --- blanked out ---------------------------------------------------
        proxy_set_header X-Forwarded-For      "";
        proxy_set_header X-Real-IP            "";
        proxy_set_header Forwarded            "";
        proxy_set_header User-Agent           "";
        proxy_set_header X-Forwarded-Host     "";
        proxy_set_header X-Forwarded-Port     "";
        proxy_set_header X-Forwarded-Server   "";
        proxy_set_header X-Original-URL       "";
        proxy_set_header Client-IP            "";
        proxy_set_header X-Client-IP          "";
        proxy_set_header True-Client-IP       "";
        proxy_set_header CF-Connecting-IP     "";

        # §4.1 — upstream compression breaks the fixed bucket size.
        proxy_set_header Accept-Encoding      "";

        # --- Phoenix Channels (WebSocket) ----------------------------------
        location /socket/ {
            proxy_pass          http://zifiri_app;
            proxy_http_version  1.1;
            proxy_buffering     off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # --- everything ----------------------------------------------------
        location / {
            proxy_pass          http://zifiri_app;
            proxy_http_version  1.1;
            proxy_read_timeout  75s;
        }
    }

    # =====================================================================
    # 127.0.0.1:8081 — onion entry. Tor runs in the same network namespace
    # (docker-compose: network_mode "service:nginx"), so this listener really
    # is on loopback and is unreachable from outside the container.
    # Every request arriving over onion appears from a single address → there is
    # no IP-based limit in §4.4; deliberately no `limit_req` here either.
    # =====================================================================
    server {
        listen      127.0.0.1:8081;
        # The onion request's Host header is the .onion address (tor preserves
        # the original Host). A full name instead of `_`: requests arriving with
        # another Host do not match this block. Since tor is the only access path,
        # this is in practice a declaration of intent, not a restriction.
        server_name $ONION_HOST;

        access_log  off;

        # No HSTS: onion is served over http.
        # No Onion-Location: the onion response does not redirect the user to
        # onion — it already is onion. Having it on clearnet is §11.3's requirement.
        # No wss://$HOST in connect-src; in CSP3 'self' covers the ws://
        # counterpart of the same origin.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;

        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cache-Control $zifiri_cache_control always;

        # §5.1 — full list (see the RULE note at the http level). The array-type
        # directive is COPIED, not inherited: if the list is incomplete in this
        # block nginx uses this incomplete list, not the one above.
        proxy_set_header Host                 $host;
        proxy_set_header X-Forwarded-Proto    $scheme;
        proxy_set_header Upgrade              $http_upgrade;
        proxy_set_header Connection           $connection_upgrade;

        # --- blanked out ---------------------------------------------------
        proxy_set_header X-Forwarded-For      "";
        proxy_set_header X-Real-IP            "";
        proxy_set_header Forwarded            "";
        proxy_set_header User-Agent           "";
        proxy_set_header X-Forwarded-Host     "";
        proxy_set_header X-Forwarded-Port     "";
        proxy_set_header X-Forwarded-Server   "";
        proxy_set_header X-Original-URL       "";
        proxy_set_header Client-IP            "";
        proxy_set_header X-Client-IP          "";
        proxy_set_header True-Client-IP       "";
        proxy_set_header CF-Connecting-IP     "";

        # §4.1 — upstream compression breaks the fixed bucket size.
        proxy_set_header Accept-Encoding      "";

        location /socket/ {
            proxy_pass          http://zifiri_app;
            proxy_http_version  1.1;
            proxy_buffering     off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        location / {
            proxy_pass          http://zifiri_app;
            proxy_http_version  1.1;
            proxy_read_timeout  75s;
        }
    }
}
