# zifiri — nginx (clearnet + onion), plan §5.1 / §10.1 / §11.3
#
# BU DOSYA BİR ŞABLONDUR. Deploy sırasında iki yer değiştirilir (deploy.md):
#   $HOST        → gerçek alan adı
#   $ONION_HOST  → /var/lib/tor/hidden_service/hostname içeriği (...onion)
# nginx ortam değişkeni genişletmez; şablonu değiştirmeden yüklemek
# `server_name` ve CSP'yi bozar.

worker_processes  auto;
pid               /run/nginx.pid;

# §5.1 — hata kaydı yok. `crit` eşiği bile /dev/null'a gider; istemci adresi
# hata girdilerine düşemez çünkü girdi yok. Hata ayıklarken geçici olarak
# `error_log stderr warn;` yap ve container log sürücüsünü aç — sonra geri al.
error_log  /dev/null crit;

events {
    worker_connections  1024;
    multi_accept        off;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types_hash_max_size 2048;

    server_tokens off;

    # ---------------------------------------------------------------------
    # §5.1 — ERİŞİM KAYDI. "Direktif yazmamak" log demek değildir: derleme
    # zamanı varsayılanı logs/access.log. Bu yüzden açıkça `off`.
    # http düzeyinde bir kez; server blokları bunu devralır.
    # Doğrulama: `nginx -T | grep -nE '^\s*access_log'` → yalnız `access_log off;`
    # (yorum satırları da `access_log` içerir, bu yüzden çapa şart)
    # ---------------------------------------------------------------------
    access_log  off;

    # §4.1 — en büyük kova 16 KB + sabit zarf. 32k tampon, gövdenin hiçbir
    # koşulda diske (temp file) yazılmaması içindir.
    client_max_body_size        24k;
    client_body_buffer_size     32k;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 8k;
    client_body_in_file_only    off;

    # Tüm geçici yollar /tmp'ye (container'da tmpfs). read_only kök fs'te
    # /var/cache/nginx yoktur ve olmamalıdır.
    client_body_temp_path  /tmp/nginx/client_body;
    proxy_temp_path        /tmp/nginx/proxy;
    fastcgi_temp_path      /tmp/nginx/fastcgi;
    uwsgi_temp_path        /tmp/nginx/uwsgi;
    scgi_temp_path         /tmp/nginx/scgi;

    # §4.1 — gövdeler sabit kovaya pad'lenir. Sıkıştırma kova boyutunu
    # içeriğe göre değiştirir, yani pad'lemeyi boşa çıkarır. Kapalı.
    gzip off;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    reset_timedout_connection on;

    # WebSocket (Phoenix Channels). Boş değer başlığı düşürür, böylece
    # upstream keepalive normal isteklerde çalışmaya devam eder.
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       '';
    }

    # §10.1 — yalnız hash'li varlıklar önbelleklenir; API ve HTML no-store.
    # Tek `add_header` yeri: location'da add_header yazmak üstteki güvenlik
    # başlıklarını sıfırlar, o yüzden map kullanılıyor.
    map $uri $zifiri_cache_control {
        ~^/assets/   "public, max-age=31536000, immutable";
        default      "no-store";
    }

    # §5.1 — nginx → Phoenix unix soket. TCP yok, dolayısıyla BEAM tarafında
    # gerçek bir peer adresi oluşmaz.
    upstream zifiri_app {
        server unix:/run/zifiri/app.sock;
        keepalive 16;
    }

    # =====================================================================
    # §5.1 — "IP BEAM'e hiç girmez" iddiasının tek gerçek yolu.
    #
    # nginx istemci başlıklarını upstream'e VARSAYILAN OLARAK geçirir; yani
    # istemcinin kendi gönderdiği X-Forwarded-For olduğu gibi Phoenix'e
    # ulaşır. Boş değer atamak başlığı tamamen düşürür (nginx boş değerli
    # başlığı göndermez).
    #
    # KURAL: `proxy_set_header` dizi tipi bir direktiftir — miras ALINMAZ,
    # KOPYALANIR. Bir alt düzeyde tek satır yazıldığında üst düzeydeki listenin
    # TAMAMI o düzey için düşer. Bu yüzden liste burada (http) değil, proxy
    # yapan her server bloğunda eksiksiz yazılır: clearnet :443 ve onion
    # 127.0.0.1:8081. İki blok ayrı ayrı doğrulanabilir olsun diye bilerek
    # kopyalanmıştır; birine satır eklerken diğerine de ekle
    # (`scripts/verify_onion.sh` ikisini de sayar).
    #
    # location bloklarında tek bir proxy_set_header bile yazılmamalıdır —
    # yazılırsa o location'da bu listenin tamamı düşer ve IP sızmaya başlar.
    #
    # `real_ip` / `set_real_ip_from` / `proxy_protocol` KULLANILMAZ: XFF'yi
    # ayrıştıran her yapılandırma, istemcinin uydurduğu değeri gerçek adres
    # sanma riskidir; unix sokette zaten ihtiyaç yok.
    # =====================================================================

    # Upstream'in kendi imzası sızmasın.
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # =====================================================================
    # :80 — yalnız ACME meydan okuması ve HTTPS'e yönlendirme.
    # =====================================================================
    server {
        listen      80;
        server_name $HOST;

        access_log  off;

        # certbot webroot modu: host'ta çalışır, dizini buraya read-only
        # bağlar (deploy.md). Container'a yazma izni gerekmez.
        location ^~ /.well-known/acme-challenge/ {
            root         /var/www/acme;
            default_type text/plain;
            access_log   off;
            add_header   Cache-Control "no-store" always;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =====================================================================
    # :443 — clearnet
    # =====================================================================
    server {
        listen      443 ssl;
        http2       on;
        server_name $HOST;

        access_log  off;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;   # biletsiz ileri gizlilik
        # OCSP stapling yok: Let's Encrypt OCSP hizmetini kapattı.

        # --- §10.1 güvenlik başlıkları -----------------------------------
        # CSP, plan §10.1'deki dize — birebir. Inline script/stil yok.
        # `require-trusted-types-for 'script'` savunma derinliğidir
        # (tarayıcı desteği değişir), yine de gönderilir.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' wss://$HOST; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), usb=(), xr-spatial-tracking=(), interest-cohort=()" always;
        add_header Cache-Control $zifiri_cache_control always;

        # §11.3 — clearnet yanıtında onion adresi duyurulur. Bu başlık
        # YALNIZ burada (clearnet) vardır; onion bloğunda karşılığı yoktur.
        add_header Onion-Location "http://$ONION_HOST$request_uri" always;

        # §5.1 — tam liste (http düzeyindeki KURAL notuna bak). Dizi tipi
        # direktif KOPYALANIR, miras alınmaz: bu blokta liste eksik olursa
        # nginx üstteki değil, buradaki eksik listeyi kullanır.
        proxy_set_header Host                 $host;
        proxy_set_header X-Forwarded-Proto    $scheme;
        proxy_set_header Upgrade              $http_upgrade;
        proxy_set_header Connection           $connection_upgrade;

        # --- boşaltılanlar -------------------------------------------------
        proxy_set_header X-Forwarded-For      "";
        proxy_set_header X-Real-IP            "";
        proxy_set_header Forwarded            "";
        proxy_set_header User-Agent           "";
        proxy_set_header X-Forwarded-Host     "";
        proxy_set_header X-Forwarded-Port     "";
        proxy_set_header X-Forwarded-Server   "";
        proxy_set_header X-Original-URL       "";
        proxy_set_header Client-IP            "";
        proxy_set_header X-Client-IP          "";
        proxy_set_header True-Client-IP       "";
        proxy_set_header CF-Connecting-IP     "";

        # §4.1 — upstream'in sıkıştırması sabit kova boyutunu bozar.
        proxy_set_header Accept-Encoding      "";

        # --- Phoenix Channels (WebSocket) --------------------------------
        location /socket/ {
            proxy_pass          http://zifiri_app;
            proxy_http_version  1.1;
            proxy_buffering     off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # --- her şey -----------------------------------------------------
        location / {
            proxy_pass          http://zifiri_app;
            proxy_http_version  1.1;
            proxy_read_timeout  75s;
        }
    }

    # =====================================================================
    # 127.0.0.1:8081 — onion girişi. Tor aynı ağ ad alanında çalışır
    # (docker-compose: network_mode "service:nginx"), yani bu listener
    # gerçekten loopback'te ve konteyner dışından erişilemez.
    # Onion üzerinden gelen her istek tek adresten görünür → §4.4'te IP
    # bazlı limit yok; burada da bilerek `limit_req` yok.
    # =====================================================================
    server {
        listen      127.0.0.1:8081;
        # Onion isteğinin Host başlığı .onion adresidir (tor, orijinal Host'u
        # korur). `_` yerine tam ad: başka bir Host ile gelen istek bu bloğa
        # düşmez. Tek erişim yolu tor olduğu için pratikte daraltma değil,
        # niyet beyanıdır.
        server_name $ONION_HOST;

        access_log  off;

        # HSTS yok: onion http üzerinden servis edilir.
        # Onion-Location YOK: onion yanıtı kullanıcıyı onion'a yönlendirmez,
        # kendisi zaten onion'dır. Clearnet'te olması §11.3'ün şartı.
        # connect-src'de wss://$HOST yok; CSP3'te 'self' aynı kaynağın
        # ws:// karşılığını kapsar.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;

        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cache-Control $zifiri_cache_control always;

        # §5.1 — tam liste (http düzeyindeki KURAL notuna bak). Dizi tipi
        # direktif KOPYALANIR, miras alınmaz: bu blokta liste eksik olursa
        # nginx üstteki değil, buradaki eksik listeyi kullanır.
        proxy_set_header Host                 $host;
        proxy_set_header X-Forwarded-Proto    $scheme;
        proxy_set_header Upgrade              $http_upgrade;
        proxy_set_header Connection           $connection_upgrade;

        # --- boşaltılanlar -------------------------------------------------
        proxy_set_header X-Forwarded-For      "";
        proxy_set_header X-Real-IP            "";
        proxy_set_header Forwarded            "";
        proxy_set_header User-Agent           "";
        proxy_set_header X-Forwarded-Host     "";
        proxy_set_header X-Forwarded-Port     "";
        proxy_set_header X-Forwarded-Server   "";
        proxy_set_header X-Original-URL       "";
        proxy_set_header Client-IP            "";
        proxy_set_header X-Client-IP          "";
        proxy_set_header True-Client-IP       "";
        proxy_set_header CF-Connecting-IP     "";

        # §4.1 — upstream'in sıkıştırması sabit kova boyutunu bozar.
        proxy_set_header Accept-Encoding      "";

        location /socket/ {
            proxy_pass          http://zifiri_app;
            proxy_http_version  1.1;
            proxy_buffering     off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        location / {
            proxy_pass          http://zifiri_app;
            proxy_http_version  1.1;
            proxy_read_timeout  75s;
        }
    }
}
